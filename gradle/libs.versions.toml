[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
junit = "4.13.2"
coroutinesTest = "1.7.3"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
# ЛР5: префікс KSP обов'язково збігається з версією Kotlin (2.0.21)
ksp = "2.0.21-1.0.28"
# ЛР5: Room 2.7 таргетить Kotlin 2.0, як і проєкт
room = "2.7.2"
# ЛР5: графіки; 2.0.3 найближча до Compose BOM 2024.12.01 і Kotlin 2.0.21
vico = "2.0.3"
# ЛР6: TensorFlow Lite. Версія фіксована, а не "+": "+" означає «будь-яка найновіша на момент збірки»,
# тож та сама ревізія коду в різні дні збиралася б з різними бібліотеками — збірка невідтворювана
# і може зламатися без жодної зміни в коді. Крім того, 2.17.0 = версія TF, якою конвертовано модель
# (ml/requirements.txt): конвертер не новіший за рантайм, тож усі версії операторів рантайму відомі.
tflite = "2.17.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# ЛР5: Room — runtime (RoomDatabase, анотації), ktx (корутини: suspend DAO, Flow), compiler (генерує код DAO через KSP)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# ЛР5: Vico для Compose з темою Material 3
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
# ЛР6: рантайм TFLite (Interpreter). Google перейменував TFLite на LiteRT (com.google.ai.edge.litert)
# з тим самим API Interpreter; беремо org.tensorflow, як у методичці
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# ЛР5: KSP — обробник анотацій для Kotlin (замість kapt); Room plugin — експорт схеми БД у JSON
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
